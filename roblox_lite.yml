---
# Minimal Roblox globals for selene, so linting works without downloading
# the full API dump. Swap for `std = "roblox"` if you run
# `selene generate-roblox-std` on a machine with internet access.
base: luau
name: roblox_lite
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  Instance: { any: true }
  Vector3: { any: true }
  Vector2: { any: true }
  Vector3int16: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  BrickColor: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Rect: { any: true }
  Enum: { any: true }
  Ray: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  TweenInfo: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  PhysicalProperties: { any: true }
  Random: { any: true }
  Region3: { any: true }
  Font: { any: true }
  DateTime: { any: true }
  Faces: { any: true }
  Axes: { any: true }
  UserSettings: { any: true }
  settings: { any: true }
  task: { any: true }
  typeof: { any: true }
  tick: { any: true }
  time: { any: true }
  warn: { any: true }
  utf8: { any: true }
